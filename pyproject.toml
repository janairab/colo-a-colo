
[build-system] # indica a ferramenta usada para construir o pacote. 
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# identifica o projeto e as dependências.   
[project]
name = "colo-a-colo"
version = "0.1.0"
requires-python = ">=3.12" # define a versão mínima de Python 
dependencies = [
    "Flask>=3.1,<4"
]

# dev agrupa dependências de desenvolvimento
[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[tool.setuptools.packages.find]
where = ["src"] # indica onde estão os pacotes.
# [tool.setuptools.package-data]  # package-data inclui recursos que não são ficheiros Python

include = ["colo_a_colo*"]

# testpaths identifica a pasta dos testes
[tool.pytest.ini_options]
testpaths = ["testes"]
