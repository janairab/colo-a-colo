
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres para aceitar acentos -->
    <meta charset="UTF-8">

    <!-- Ajusta a página para diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título apresentado na aba do navegador -->
    <title>Registrar Sono | Colo a Colo</title>
</head>
<body>

    <!-- Título da página -->
    <h1>Registrar Sono</h1>

    <!-- Formulário para registrar o sono do bebê -->
    <form method="POST" action="/novo/sono">

        <!-- Seleção do bebê -->
        <label for="id_bebe">Bebê:</label>
        <br>

        <select id="id_bebe" name="id_bebe" required>
            <option value="">Selecione o bebê</option>

            <!-- Percorre a lista de bebês recebida do Flask -->
            {% for bebe in bebes %}
                <option value="{{ bebe[0] }}">{{ bebe[1] }}</option>
            {% endfor %}
        </select>

        <br><br>

        <!-- Data e hora em que o bebê começou a dormir -->
        <label for="data_hora">Início do sono:</label>
        <br>

        <input
            type="datetime-local"
            id="data_hora"
            name="data_hora"
            min="{{ data_minima_html }}"
            max="{{ data_maxima_html }}"
            required
        >

        <br><br>

        <!-- Data e hora em que o bebê acordou -->
        <label for="fim_sono">Término do sono:</label>
        <br>

        <input
            type="datetime-local"
            id="fim_sono"
            name="fim_sono"
        >

        <br><br>

        <!-- Campo opcional para observações -->
        <label for="notas">Observações:</label>
        <br>

        <textarea
            id="notas"
            name="notas"
            rows="3"
            placeholder="Adicione alguma observação..."
        ></textarea>

        <br><br>

        <!-- Envia os dados do formulário -->
        <button type="submit">Salvar</button>

        <!-- Retorna à página inicial -->
        <p><a href="/">Voltar à página inicial</a></p>

    </form>

</body>
</html>
