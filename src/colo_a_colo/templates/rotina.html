
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres para aceitar acentos -->
    <meta charset="UTF-8">

    <!-- Ajusta a página para diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título apresentado na aba do navegador -->
    <title>Adicionar Rotina | Colo a Colo</title>
</head>
<body>

    <!-- Título da página -->
    <h1>Adicionar Rotina</h1>

    <!-- Formulário para selecionar os dados iniciais do registro -->
    <form method="POST" action="{{ url_for('rotina.nova_rotina') }}">

        <!-- Seleção do bebê -->
        <label for="id_bebe">Bebê:</label>
        <select id="id_bebe" name="id_bebe" required>

            <option value="">Selecione o bebê</option>

            {% for bebe in bebes %}
                <option value="{{ bebe[0] }}">
                    {{ bebe[1] }}
                </option>
            {% endfor %}

        </select>

        <br><br>

        <!-- Data e hora do registro -->
        <label for="data_hora">Data e hora:</label>
        <input
            type="datetime-local"
            id="data_hora"
            name="data_hora"
            min="{{ data_minima_html }}"
            max="{{ data_maxima_html }}"
            value="{{ data_maxima_html }}"
            required
        >

        <br><br>

        <!-- Seleção do tipo de registro -->
        <label for="tipo_registro">Tipo de registro:</label>
        <select id="tipo_registro" name="tipo_registro" required>

            <option value="">Selecione o tipo de registro</option>
            <option value="alimentacao">Alimentação</option>
            <option value="sono">Sono</option>
            <option value="banho">Banho</option>
            <option value="fralda">Fralda</option>

        </select>

        <br><br>

        <!-- Campo para observações -->
        <label for="notas">Observações:</label>
        <textarea
            id="notas"
            name="notas"
            rows="4"
            cols="40"
        ></textarea>

        <br><br>

        <!-- Envia os dados para a rota geral -->
        <button type="submit">Continuar</button>

    </form>

    <br>

    <!-- Retorna à página inicial -->
    <a href="/">Voltar à página inicial</a>

</body>
</html>
